name: Qt C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt and SQLite driver
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qt5-qmake libqt5sql5-sqlite

      - name: Configure with qmake
        run: qmake SRecord.pro CONFIG+=release

      - name: Build
        run: make -j"$(nproc)"

      - name: Verify database source file
        run: test -f sinfo.db
